version: '3.8'

services:
  app:
    build: .
    container_name: optihazmat_app
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - optihazmat_net
    volumes:
      - ./public/uploads:/app/public/uploads

  mysql:
    image: mysql:8.4
    container_name: optihazmat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - optihazmat_net

networks:
  optihazmat_net:
    driver: bridge

volumes:
  mysql_data:
